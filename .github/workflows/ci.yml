name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: saas_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd backend
        npm ci

    - name: Run Migrations
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: saas_db_test
        DB_USER: postgres
        DB_PASSWORD: password
      run: |
        cd backend
        node scripts/runMigrations.js

    - name: Run Tests
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: saas_db_test
        DB_USER: postgres
        DB_PASSWORD: password
        JWT_SECRET: supersecrettestkey
        JWT_EXPIRES_IN: 1h
      run: |
        cd backend
        npm test
